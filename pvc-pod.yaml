apiVersion: v1
kind: Pod
metadata:
  name: emergency-storage-pod
spec:
  containers:
    - name: nginx
      image: nginx:alpine
      command: ["/bin/sh", "-c"]
      args:
        - while true; do date >> /data/timestamp.txt; sleep 10; done
      volumeMounts:
        - name: emergency-volume
          mountPath: /data
  volumes:
    - name: emergency-volume
      persistentVolumeClaim:
        claimName: emergency-storage